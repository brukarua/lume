<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lume</title>
    <link rel="stylesheet" href="css/contact.css">
    <link rel="stylesheet" href="css/navbar2.css">

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
      (function() {
        emailjs.init({
          publicKey: "QWaQGWGgGmtRjTSlq",
        });
      })();
    </script>
</head>
<body>
    <header class="navbar">
        <nav class="navnav">
            <div class="nav-lado nav-esquerda">
                <a href="index.html" class="nav-item">Início</a>
            </div>

            <div class="nav-logo">
                <a href="index.html">
                    <img src="imagens/lumelogo.png" alt="Lume">
                </a>
            </div>
        </nav>
    </header>

    <div id="contato">
        <h1></h1>
    </div>

    <div class="contact">
        <section class="container">
            <h2 class="titulo">Contato</h2>
            <p class="subtitulo">Gostaria de falar conosco ou dar uma sugestão? Deixe sua mensagem!</p>

            <div class="cartao-contato">
                <form class="formulario" id="form-contato">
                    <div class="form-row">
                        <input type="text" name="user_name" placeholder="Nome" required>
                        <input type="email" name="user_email" placeholder="E-mail" required>
                    </div>
                    <input type="text" name="message" placeholder="Mensagem" required class="full-width">
                    <button type="submit" class="btn btn-right">Enviar</button>
                </form>
            </div>

            <div class="infoContato">
                <p>São Paulo, Brasil</p>
                <p>Phone: +55 12 99609-8360</p>
                <p>Email: <a href="https://mail.google.com/mail/?view=cm&fs=1&to=lume.forcontact@gmail.com" target="_blank" class="link-email">lume.forcontact@gmail.com</a></p>
            </div>
        </section>
    </div>

    <script>
        document.getElementById('form-contato').addEventListener('submit', function(event) {
            event.preventDefault();
            const serviceID = 'service_x648r6e';
            const templateID = 'template_r0ch88p';

            emailjs.sendForm(serviceID, templateID, this)
                .then(() => {
                    alert('Mensagem enviada com sucesso!');
                    this.reset();
                }, (error) => {
                    alert('Erro ao enviar mensagem: ' + JSON.stringify(error));
                });
        });
    </script>
</body>
</html>
